const API_BASE = "https://prevmaint.onrender.com/api";

/* ---------------- API client (live backend) ------------------------------- */
async function apiFetch(path, opts) {
  opts = opts || {};
  const res = await fetch(API_BASE + path, { method: opts.method || "GET", headers: { "Content-Type": "application/json" }, body: opts.body });
  if (!res.ok) { let msg = "HTTP " + res.status; try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {} throw new Error(msg); }
  if (res.status === 204) return null;
  return res.json();
}
const api = {
  listSites: () => apiFetch("/installations"),
  getSite: (id) => apiFetch("/installations/" + id),
  createSite: (b) => apiFetch("/installations", { method: "POST", body: JSON.stringify(b) }),
  deleteSite: (id) => apiFetch("/installations/" + id, { method: "DELETE" }),
  listAssets: (id) => apiFetch("/installations/" + id + "/assets"),
  createAsset: (id, b) => apiFetch("/installations/" + id + "/assets", { method: "POST", body: JSON.stringify(b) }),
  deleteAsset: (a, b) => apiFetch("/assets/" + (b || a), { method: "DELETE" }),
  getChecklists: () => apiFetch("/checklists"),
  updateChecklistDefault: (t, url) => apiFetch("/checklists/" + t, { method: "PATCH", body: JSON.stringify({ defaultSopUrl: url }) }),
  updatePm: (t, key, b) => apiFetch("/pm-definitions/" + t + "/" + key, { method: "PATCH", body: JSON.stringify(b) }),
  getDue: (id) => apiFetch("/installations/" + id + "/due"),

  listReports: (id) => apiFetch("/installations/" + id + "/reports"),

  updateSitePm: (id, type, key, b) => apiFetch("/installations/" + id + "/pm-items/" + type + "/" + key, { method: "PATCH", body: JSON.stringify(b) }),
  deleteSitePm: (id, type, key) => apiFetch("/installations/" + id + "/pm-items/" + type + "/" + key, { method: "DELETE" }),

function useAsync(fn, deps) {
  const [st, setSt] = useState({ loading:true, error:null, data:null });
  const run = () => { setSt((s)=>({ ...s, loading:true, error:null })); Promise.resolve().then(fn).then((d)=>setSt({loading:false,error:null,data:d}),(e)=>setSt({loading:false,error:String(e.message||e),data:null})); };
  useEffect(run, deps||[]);
  return { ...st, reload:run };
}
function Loading({ what }) {
  const [slow, setSlow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setSlow(true), 4000); return () => clearTimeout(t); }, []);
  return html`<div class="rounded-xl border border-line bg-surface p-8 text-center text-sm text-muted">${what||"Loading"}…
    ${slow && html`<div class="mt-2 text-xs text-muted/70">First load after the server has been idle can take up to a minute — hang tight.</div>`}
  </div>`;
}
function ErrorBox({ msg, onRetry }) {
  return html`<div class="rounded-xl border border-over/40 bg-over/10 p-6 text-center">
    <p class="text-sm text-over">Couldn’t reach the server (${msg}).</p>
    <p class="mt-1 text-xs text-over/70">If the server was idle it may still be waking up — wait a moment and retry.</p>
    ${onRetry && html`<button class=${ghost+" mt-3"} onClick=${onRetry}>Retry</button>`}
  </div>`;
}
function TextField({ label, value, onInput, placeholder, type="text", req }) {
  return html`<label class="block"><span class=${lbl}>${label} ${req && html`<span class="text-over">*</span>`}</span>
    <input class=${field+" no-spin"} type=${type} value=${value||""} placeholder=${placeholder||""} onInput=${(e)=>onInput(e.target.value)} /></label>`;
}

/* ---------------- theme ---------------------------------------------------- */
function useTheme() {
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("ck_theme") || "dark"; } catch { return "dark"; } });
  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); try { localStorage.setItem("ck_theme", theme); } catch {} }, [theme]);
  return [theme, () => setTheme((t) => t === "dark" ? "light" : "dark")];
}

function SiteDetail({ siteId, onBack }) {
  const site = useAsync(() => api.getSite(siteId), [siteId]);
  const assets = useAsync(() => api.listAssets(siteId), [siteId]);
  const [f, setF] = useState({ type:"bot", name:"", serial:"" });
  const [confirmDel, setConfirmDel] = useState(false);
  const typeIcon = (t) => t==="bot"?"bot":t==="lift"?"lift":"layers";
  const add = async () => { if (!f.name.trim()) return; await api.createAsset(siteId, { type:f.type, name:f.name.trim(), serial:f.serial.trim()||"—" }); setF({ type:f.type, name:"", serial:"" }); assets.reload(); };
  const remove = async (id) => { if (!confirm("Remove this asset and its history?")) return; await api.deleteAsset(siteId, id); assets.reload(); };
  const removeSite = async () => { await api.deleteSite(siteId); onBack(); };
  return html`<div>
    <button onClick=${onBack} class="mb-3 text-sm text-muted hover:text-sub">← All locations</button>
    ${site.loading ? html`<${Loading} what="Loading" />` : site.error ? html`<${ErrorBox} msg=${site.error} onRetry=${site.reload} />` : html`<div><h2 class="text-lg font-semibold">${site.data.name}</h2><p class="mb-4 text-xs text-muted">${site.data.timezone} ${site.data.notes?"· "+site.data.notes:""}</p></div>`}
    <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted">Assets</p>
    ${assets.loading ? html`<${Loading} what="Loading assets" />` : assets.error ? html`<${ErrorBox} msg=${assets.error} onRetry=${assets.reload} />` : html`<div class="space-y-2">
      ${assets.data.map((a) => html`<div key=${a.id} class="flex items-center gap-3 rounded-xl border border-line bg-surface px-4 py-3">
        <span class="text-muted"><${Icon} n=${typeIcon(a.type)} s=18/></span>
        <div class="min-w-0 flex-1"><div class="font-medium">${a.name}</div><div class="text-xs text-muted">${a.type} · ${a.serial}</div></div>
        ${a.type!=="other" && html`<button onClick=${()=>remove(a.id)} class="text-muted hover:text-over"><${Icon} n="trash" s=16/></button>`}
      </div>`)}</div>`}
    <div class="mt-3 rounded-xl border border-line bg-surface p-4">
      <div class="grid gap-3 sm:grid-cols-[1fr_1.4fr_1.4fr]">
        <label class="block"><span class=${lbl}>Type</span><select class=${field} value=${f.type} onChange=${(e)=>setF({...f,type:e.target.value})}><option value="bot">bot</option><option value="lift">lift</option></select></label>
        <${TextField} label="Name" value=${f.name} onInput=${(v)=>setF({...f,name:v})} placeholder="Bot 03"/>
        <${TextField} label="Serial / asset ID" value=${f.serial} onInput=${(v)=>setF({...f,serial:v})} placeholder="LB-24-0003"/>
      </div>
      <button class=${primary+" mt-3"} onClick=${add}><span class="inline-flex items-center gap-1.5"><${Icon} n="plus" s=15/> Add asset</span></button>
    </div>

    <div class="mt-8">
      <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted">Checklists for this site</p>
      <${SiteChecklists} siteId=${siteId} hasLayout=${site.data && site.data.has_layout} />
    </div>

    <div class="mt-8 border-t border-line pt-4">
      ${!confirmDel ? html`<button onClick=${()=>setConfirmDel(true)} class="inline-flex items-center gap-1.5 text-sm text-over hover:brightness-110"><${Icon} n="trash" s=15/> Delete location</button>`
        : html`<div class="rounded-xl border border-over/40 bg-over/10 p-4"><p class="text-sm text-over">Delete this location and <b>all</b> of its assets, history and reports? This can’t be undone.</p>
          <div class="mt-3 flex gap-2"><button class=${btn+" bg-over text-white hover:brightness-110"} onClick=${removeSite}>Yes, delete permanently</button><button class=${ghost} onClick=${()=>setConfirmDel(false)}>Cancel</button></div></div>`}
    </div>

function SiteChecklists({ siteId, hasLayout }) {
  const q = useAsync(() => api.getSiteChecklists(siteId), [siteId]);
  const [cl, setCl] = useState(null);
  const [open, setOpen] = useState(null);
  const [adding, setAdding] = useState(null); // asset type currently showing the add-item form
  const [nf, setNf] = useState({ name:"", category:"Visual", frequency_unit:"month", frequency_every:1, photo_required:false });
  useEffect(() => { if (q.data) setCl(q.data); }, [q.data]);
  if (q.loading) return html`<${Loading} what="Loading checklists" />`;
  if (q.error) return html`<${ErrorBox} msg=${q.error} onRetry=${q.reload} />`;
  if (!cl) return null;

  const types = ["bot", "lift"].concat(hasLayout ? ["other"] : []);
  const patchLocal = (type, key, p) => setCl((c) => ({ ...c, [type]: { ...c[type], pms: c[type].pms.map((x)=>x.pm_key===key?{...x,...p}:x) } }));
  const save = (type, key, body) => api.updateSitePm(siteId, type, key, body).then(()=>{ if(!cl[type].forked) q.reload(); }).catch((e)=>alert("Save failed: "+e.message));
  const removeItem = async (type, key) => { if(!confirm("Remove this item from this site?")) return; try { await api.deleteSitePm(siteId, type, key); q.reload(); } catch(e){ alert("Remove failed: "+e.message); } };
  const reset = async (type) => { if(!confirm("Reset this checklist to the global default? Site-specific changes will be lost.")) return; try { await api.resetSiteChecklist(siteId, type); q.reload(); } catch(e){ alert("Reset failed: "+e.message); } };
  const addItem = async (type) => { if(!nf.name.trim()) return; try { await api.addSitePm(siteId, type, { ...nf, frequencyEvery:nf.frequency_every, frequencyUnit:nf.frequency_unit, photoRequired:nf.photo_required }); setNf({ name:"", category:"Visual", frequency_unit:"month", frequency_every:1, photo_required:false }); setAdding(null); q.reload(); } catch(e){ alert("Add failed: "+e.message); } };

  return html`<div class="space-y-2">
    ${types.map((type) => { const c = cl[type]; if (!c) return null; const isOpen = open===type; return html`
      <div key=${type} class="overflow-hidden rounded-xl border border-line bg-surface">
        <button onClick=${()=>setOpen(isOpen?null:type)} class="flex w-full items-center gap-2 px-4 py-3 text-left">
          <span class="text-muted"><${Icon} n=${isOpen?"chevD":"chevR"} s=16/></span>
          <span class="flex-1 font-medium">${c.label}</span>
          <span class=${"rounded px-2 py-0.5 text-[11px] font-medium " + (c.forked ? "bg-brand/15 text-brand" : "bg-muted/20 text-muted")}>${c.forked ? "Custom" : "Global default"}</span>
          <span class="text-xs text-muted">${c.pms.filter((p)=>p.active!==false).length}/${c.pms.length}</span>
        </button>
        ${isOpen && html`<div class="border-t border-line p-4">
          ${!c.forked && html`<div class="mb-3 rounded-lg bg-brand/10 px-3 py-2 text-xs text-sub">This site uses the global checklist. Any change below creates a site-specific copy that no longer tracks the global template.</div>`}
          <div class="space-y-2">${c.pms.map((pm) => html`<div key=${pm.pm_key} class=${"rounded-lg border p-3 " + (pm.active===false ? "border-line bg-surface2/40 opacity-60" : "border-line")}>
            <div class="flex items-start gap-2">
              <label class="mt-0.5 flex items-center" title="Assign to this site"><input type="checkbox" checked=${pm.active!==false} onChange=${(e)=>{patchLocal(type,pm.pm_key,{active:e.target.checked});save(type,pm.pm_key,{active:e.target.checked});}}/></label>
              <div class="min-w-0 flex-1 text-sm font-medium">${pm.name}</div>
              <span class=${"shrink-0 rounded px-2 py-0.5 text-[11px] " + (String(pm.category).includes("Visual")?"bg-brand/15 text-brand":"bg-muted/20 text-muted")}>${pm.category}</span>
              <button onClick=${()=>removeItem(type,pm.pm_key)} class="text-muted hover:text-over"><${Icon} n="trash" s=15/></button>
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-3 pl-6">
              <label class="flex items-center gap-1.5 text-xs"><input type="checkbox" checked=${pm.photo_required} onChange=${(e)=>{patchLocal(type,pm.pm_key,{photo_required:e.target.checked});save(type,pm.pm_key,{photoRequired:e.target.checked});}}/> Photo required</label>
              <label class="flex items-center gap-1.5 text-xs">Every <input class="w-14 rounded border border-line bg-surface2 px-2 py-1 no-spin" type="number" min="1" value=${pm.frequency_every} onInput=${(e)=>{const v=Math.max(1,+e.target.value||1);patchLocal(type,pm.pm_key,{frequency_every:v});save(type,pm.pm_key,{frequencyEvery:v});}}/>
                <select class="rounded border border-line bg-surface2 px-2 py-1" value=${pm.frequency_unit} onChange=${(e)=>{patchLocal(type,pm.pm_key,{frequency_unit:e.target.value});save(type,pm.pm_key,{frequencyUnit:e.target.value});}}><option value="day">day(s)</option><option value="week">week(s)</option><option value="month">month(s)</option></select></label>
            </div>
            <div class="mt-2 pl-6"><input class=${field} value=${pm.sop_url||""} placeholder="SOP link (optional)" onInput=${(e)=>patchLocal(type,pm.pm_key,{sop_url:e.target.value})} onBlur=${(e)=>save(type,pm.pm_key,{sopUrl:e.target.value||null})}/></div>
            <div class="mt-2 pl-6"><input class=${field} value=${pm.notes||""} placeholder="Site note for technicians (optional)" onInput=${(e)=>patchLocal(type,pm.pm_key,{notes:e.target.value})} onBlur=${(e)=>save(type,pm.pm_key,{notes:e.target.value})}/></div>
          </div>`)}</div>
          ${adding===type ? html`<div class="mt-3 rounded-lg border border-brand/40 p-3">
            <div class="grid gap-2 sm:grid-cols-[2fr_1fr]">
              <${TextField} label="Item name" value=${nf.name} onInput=${(v)=>setNf({...nf,name:v})} placeholder="New check…"/>
              <label class="block"><span class=${lbl}>Category</span><select class=${field} value=${nf.category} onChange=${(e)=>setNf({...nf,category:e.target.value})}><option>Visual</option><option>Functional</option><option>Visual/Functional</option></select></label>
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-3">
              <label class="flex items-center gap-1.5 text-xs"><input type="checkbox" checked=${nf.photo_required} onChange=${(e)=>setNf({...nf,photo_required:e.target.checked})}/> Photo required</label>
              <label class="flex items-center gap-1.5 text-xs">Every <input class="w-14 rounded border border-line bg-surface2 px-2 py-1 no-spin" type="number" min="1" value=${nf.frequency_every} onInput=${(e)=>setNf({...nf,frequency_every:Math.max(1,+e.target.value||1)})}/>
                <select class="rounded border border-line bg-surface2 px-2 py-1" value=${nf.frequency_unit} onChange=${(e)=>setNf({...nf,frequency_unit:e.target.value})}><option value="day">day(s)</option><option value="week">week(s)</option><option value="month">month(s)</option></select></label>
            </div>
            <div class="mt-2 flex gap-2"><button class=${primary} onClick=${()=>addItem(type)}>Add item</button><button class=${ghost} onClick=${()=>setAdding(null)}>Cancel</button></div>
          </div>` : html`<div class="mt-3 flex items-center justify-between">
            <button onClick=${()=>setAdding(type)} class="flex items-center gap-1.5 text-sm text-sub hover:text-ink"><${Icon} n="plus" s=15/> Add checklist item</button>
            ${c.forked && html`<button onClick=${()=>reset(type)} class="text-xs text-muted hover:text-over">Reset to global default</button>`}
          </div>`}
        </div>`}
      </div>`; })}
  </div>`;
}

function ChecklistEditor() {
  const q = useAsync(() => api.getChecklists(), []);

  const [open, setOpen] = useState("bot");
  useEffect(() => { if (q.data) setCl(q.data); }, [q.data]);

  if (q.error) return html`<${ErrorBox} msg=${q.error} onRetry=${q.reload} />`;
  if (!cl) return null;
  const patchPm = (type, key, p) => setCl((c) => ({ ...c, [type]: { ...c[type], pms: c[type].pms.map((x)=>x.pm_key===key?{...x,...p}:x) } }));
  const savePm = (type, key, body) => api.updatePm(type, key, body).catch((e)=>alert("Save failed: "+e.message));
  const patchDefault = (type, url) => setCl((c) => ({ ...c, [type]: { ...c[type], defaultSopUrl: url } }));
  return html`<div class="space-y-3">
    <p class="text-xs text-muted">Global checklists (same at every site). Changes save automatically. Per-site editing and add/remove items arrive in the next update.</p>
    ${["bot","lift","other"].map((type) => { const c = cl[type]; const isOpen = open===type; return html`
      <div key=${type} class="overflow-hidden rounded-xl border border-line bg-surface">
        <button onClick=${()=>setOpen(isOpen?null:type)} class="flex w-full items-center gap-2 px-4 py-3 text-left">
          <span class="text-muted"><${Icon} n=${isOpen?"chevD":"chevR"} s=16/></span><span class="flex-1 font-medium">${c.label}</span><span class="text-xs text-muted">${c.pms.length} PMs</span></button>
        ${isOpen && html`<div class="border-t border-line p-4">
          <div class="mb-3"><span class=${lbl}>Default SOP link for this checklist</span><input class=${field} value=${c.defaultSopUrl||""} onInput=${(e)=>patchDefault(type,e.target.value)} onBlur=${(e)=>api.updateChecklistDefault(type,e.target.value||null).catch((x)=>alert("Save failed: "+x.message))}/></div>
          <div class="space-y-3">${c.pms.map((pm) => html`<div key=${pm.pm_key} class="rounded-lg border border-line p-3">

              <span class=${"shrink-0 rounded px-2 py-0.5 text-[11px] " + (pm.category.includes("Visual")?"bg-brand/15 text-brand":"bg-muted/20 text-muted")}>${pm.category}</span></div>
            <div class="mt-2 flex flex-wrap items-center gap-3">
              <label class="flex items-center gap-1.5 text-xs"><input type="checkbox" checked=${pm.photo_required} onChange=${(e)=>{patchPm(type,pm.pm_key,{photo_required:e.target.checked});savePm(type,pm.pm_key,{photoRequired:e.target.checked});}}/> Photo required</label>
              <label class="flex items-center gap-1.5 text-xs">Every <input class="w-14 rounded border border-line bg-surface2 px-2 py-1 no-spin" type="number" min="1" value=${pm.frequency_every} onInput=${(e)=>{const v=Math.max(1,+e.target.value||1);patchPm(type,pm.pm_key,{frequency_every:v});savePm(type,pm.pm_key,{frequencyEvery:v});}}/>
                <select class="rounded border border-line bg-surface2 px-2 py-1" value=${pm.frequency_unit} onChange=${(e)=>{patchPm(type,pm.pm_key,{frequency_unit:e.target.value});savePm(type,pm.pm_key,{frequencyUnit:e.target.value});}}><option value="day">day(s)</option><option value="week">week(s)</option><option value="month">month(s)</option></select></label>
            </div>
            <div class="mt-2"><span class="text-[11px] text-muted">SOP override (blank = checklist default)</span><input class=${field} value=${pm.sop_url||""} placeholder=${c.defaultSopUrl||""} onInput=${(e)=>patchPm(type,pm.pm_key,{sop_url:e.target.value})} onBlur=${(e)=>savePm(type,pm.pm_key,{sopUrl:e.target.value||null})}/></div>
          </div>`)}</div>
        </div>`}
      </div>`; })}
  </div>`;
}

/* ---------------- TECHNICIAN ---------------------------------------------- */
function Tech() {
  const [screen, setScreen] = useState("pick");
  const [site, setSite] = useState({ id:null, name:"" });
  if (screen==="report") return html`<${Report} siteId=${site.id} siteName=${site.name} onDone=${()=>setScreen("pick")} />`;
  if (screen==="history") return html`<${History} siteId=${site.id} siteName=${site.name} onBack=${()=>setScreen("histpick")} />`;
  if (screen==="histpick") return html`<${SitePicker} title="Past reports — pick a location" onBack=${()=>setScreen("pick")} onPick=${(s)=>{ setSite(s); setScreen("history"); }} />`;
  return html`<div>
    <div class="mb-4 flex items-center justify-between">
      <p class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-muted"><${Icon} n="map" s=14/> Pick a location</p>
      <button onClick=${()=>setScreen("histpick")} class="flex items-center gap-1.5 text-sm text-muted hover:text-sub"><${Icon} n="history" s=15/> Past reports</button>
    </div>
    <${SitePicker} onPick=${(s)=>{ setSite(s); setScreen("report"); }} />
  </div>`;
}

function SitePicker({ onPick, onBack, title }) {
  const sites = useAsync(() => api.listSites(), []);
  return html`<div>
    ${title && html`<button onClick=${onBack} class="mb-3 text-sm text-muted hover:text-sub">← Back</button>`}
    ${title && html`<h2 class="mb-4 text-lg font-semibold">${title}</h2>`}
    ${sites.loading ? html`<${Loading} what="Loading locations" />` : sites.error ? html`<${ErrorBox} msg=${sites.error} onRetry=${sites.reload} />` : html`<div class="space-y-2">${sites.data.map((s)=>html`<button key=${s.id} onClick=${()=>onPick({id:s.id,name:s.name})} class="flex w-full items-center gap-3 rounded-xl border border-line bg-surface px-4 py-4 text-left hover:border-brand/50">
      <div class="min-w-0 flex-1"><div class="font-medium">${s.name}</div><div class="mt-0.5 text-xs text-muted">${s.bots} bots · ${s.lifts} lifts</div></div>
      <span class="text-muted"><${Icon} n="chevR" s=18/></span></button>`)}</div>`}
  </div>`;
}

function Report({ siteId, siteName, onDone }) {
  const due = useAsync(() => api.getDue(siteId), [siteId]);
  const [rows, setRows] = useState(null);
  const [tech, setTech] = useState("");
  const [date, setDate] = useState(todayISO());
  const [timeLog, setTimeLog] = useState("");
  const [safety, setSafety] = useState([false,false,false]);
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);
  const SAFETY = ["Machine powered down and LOTO applied (if required)?","Required PPE (Gloves, Safety Shoes, Glasses) worn?","Work area clear of debris and unauthorized personnel?"];
  useEffect(() => { if (due.data) setRows(due.data.map((r)=>({ ...r, status:"pending", notes:"", photo:null }))); }, [due.data]);
  const upd = (i, p) => setRows((rs)=>rs.map((r,j)=>j===i?{...r,...p}:r));
  const counts = useMemo(() => (rows||[]).reduce((a,r)=>{a[r.status]++;return a;},{pending:0,flag:0,done:0}), [rows]);
  const canSubmit = rows && tech.trim() && rows.every((r)=>!(r.status==="done"&&r.photoRequired&&!r.photo)) && rows.every((r)=>!(r.status==="flag"&&!r.notes.trim()));
  const submit = async () => { setSubmitting(true); await api.submitReport(siteId, { technician:tech.trim(), date, timeLog:timeLog.trim(), safety, items:rows.map((r)=>({assetId:r.assetId,assetName:r.assetName,pmKey:r.pmKey,pmName:r.pmName,status:r.status,notes:r.notes,photo:r.photo,cyclesMissed:r.cyclesMissed})) }); setDone(true); };
  if (done) return html`<div class="mx-auto max-w-md rounded-xl border border-done/40 bg-done/10 p-8 text-center">
    <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-done/20 text-done"><${Icon} n="check" s=24/></div>
    <p class="font-semibold text-done">Report submitted</p><p class="mt-1 text-sm text-muted">Saved to the shared record for ${siteName}.</p>
    <button class=${primary+" mt-4"} onClick=${onDone}>Done</button></div>`;
  return html`<div>
    <button onClick=${onDone} class="mb-3 text-sm text-muted hover:text-sub">← Cancel</button>
    <div class="mb-1 text-[10px] uppercase tracking-widest text-muted">CHL-MTN-MTNCHL-01</div>
    <h2 class="mb-4 text-lg font-semibold">New PM report — ${siteName}</h2>
    <div class="mb-4 grid grid-cols-2 gap-3 rounded-xl border border-line bg-surface p-4 sm:grid-cols-4">
      <label class="block"><span class=${lbl}>Date <span class="text-over">*</span></span><input type="date" class=${field} value=${date} onInput=${(e)=>setDate(e.target.value)}/></label>
      <label class="block"><span class=${lbl}>Location</span><input class=${field+" opacity-70"} value=${siteName} disabled/></label>
      <${TextField} label="Technician" req=${true} value=${tech} onInput=${setTech} placeholder="Your name"/>
      <${TextField} label="Time log (optional)" value=${timeLog} onInput=${setTimeLog} placeholder="45 min"/>
    </div>
    <div class="mb-4 rounded-xl border border-line bg-surface p-4"><p class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted">Before you start</p>
      ${SAFETY.map((s,i)=>html`<label key=${i} class="flex items-start gap-2 py-1 text-sm"><input type="checkbox" class="mt-1" checked=${safety[i]} onChange=${(e)=>setSafety(safety.map((v,j)=>j===i?e.target.checked:v))}/> <span>${s}</span></label>`)}
    </div>
    ${due.loading ? html`<${Loading} what="Loading what’s due" />` : due.error ? html`<${ErrorBox} msg=${due.error} onRetry=${due.reload} />` : !rows||rows.length===0 ? html`<div class="rounded-xl border border-dashed border-line bg-surface p-8 text-center text-sm text-muted">Nothing due within the next 7 days.</div>`
      : html`<div>
        <div class="mb-3 flex items-center gap-2 rounded-lg bg-brand/15 px-3 py-2 text-sm text-brand"><${Icon} n="arrow" s=16/> ${rows.length} PMs due — most overdue first · repeats collapsed</div>
        <div class="space-y-2">${rows.map((r,i)=>html`<${ReportRow} key=${r.assetId+r.pmKey} r=${r} onStatus=${(s)=>upd(i,{status:s})} onNotes=${(n)=>upd(i,{notes:n})} onPhoto=${(p)=>upd(i,{photo:p})} />`)}</div>
        <div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-line pt-4">
          <span class="text-sm text-muted">${counts.done} done · ${counts.flag} flagged · ${counts.pending} not completed</span>
          <button class=${primary} disabled=${!canSubmit||submitting} onClick=${submit}>${submitting?"Submitting…":"Submit report"}</button></div>
        ${!canSubmit && html`<p class="mt-2 text-right text-xs text-muted">${!tech.trim()?"Enter your name. ":""}Flagged items need a note; photo-required items need a photo before Done.</p>`}
      </div>`}
  </div>`;
}

function ReportRow({ r, onStatus, onNotes, onPhoto }) {
  const [open, setOpen] = useState((r.label.tone==="over"||r.label.tone==="red"));
  const chip = toneChip[r.label.tone] || toneChip.muted;
  const stateBtn = (key, label, activeCls) => html`<button onClick=${()=>onStatus(key)} class=${"rounded-lg border px-3 py-1.5 text-xs font-medium " + (r.status===key?activeCls:"border-line text-muted hover:bg-surface2")}>${label}</button>`;
  const photoFile = (e) => { const f = e.target.files && e.target.files[0]; if (f) onPhoto({ name:f.name }); };
  return html`<div class=${"overflow-hidden rounded-xl border bg-surface " + ((r.label.tone==="over"||r.label.tone==="red")&&r.status==="pending"?"border-over/40":"border-line")}>
    <button onClick=${()=>setOpen(!open)} class="flex w-full items-center gap-2 px-3 py-3 text-left">
      <span class="text-muted"><${Icon} n=${open?"chevD":"chevR"} s=16/></span>
      <span class="shrink-0 rounded bg-surface2 px-2 py-0.5 text-[11px] font-medium text-sub">${r.assetName}</span>
      <span class="min-w-0 flex-1 truncate text-sm font-medium">${r.pmName}</span>
      <span class=${"shrink-0 rounded px-2 py-0.5 text-[11px] font-semibold " + chip}>${r.label.text}</span></button>
    ${open && html`<div class="border-t border-line px-3 py-3">
      <div class="flex flex-wrap items-center gap-2">
        ${stateBtn("pending","Not completed","bg-surface2 text-ink border-line")}
        ${stateBtn("flag","⚑ Flag","bg-flag/20 text-flag border-flag/50")}
        ${stateBtn("done","✓ Done","bg-done/20 text-done border-done/50")}
        <label class=${"flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-medium cursor-pointer " + (r.photo?"border-done/60 text-done":"border-line text-muted hover:bg-surface2")}>
          <${Icon} n="camera" s=14/> ${r.photo?"Photo ✓":"Photo"}${r.photoRequired?html` <span class="text-over">*</span>`:""}
          <input type="file" accept="image/*" capture="environment" class="hidden" onChange=${photoFile}/></label>
        <a href=${r.sop} target="_blank" rel="noopener" class="ml-auto flex items-center gap-1 self-center text-xs text-brand hover:underline">SOP <${Icon} n="link" s=13/></a>
      </div>
      ${r.photo && html`<p class="mt-2 text-[11px] text-muted">Captured: ${r.photo.name}</p>`}
      ${r.siteNote && html`<p class="mt-2 text-[11px] text-sub">Site note: ${r.siteNote}</p>`}
      ${r.cyclesMissed>=2 && html`<p class="mt-2 text-[11px] text-over">${r.cyclesMissed} monthly cycles outstanding — completing clears the backlog and resets the clock.</p>`}
      <textarea class=${field+" mt-2 "+(r.status==="flag"?"border-flag/60":"")} rows="2" value=${r.notes} onInput=${(e)=>onNotes(e.target.value)} placeholder=${r.status==="flag"?"What’s wrong, and where on the asset? (required)":r.status==="pending"?"Reason not completed (recommended)":"Notes (optional)"}></textarea>
    </div>`}
  </div>`;
}

function History({ siteId, siteName, onBack }) {
  const reports = useAsync(() => api.listReports(siteId), [siteId]);
  const [openId, setOpenId] = useState(null);
  const [details, setDetails] = useState({});
  const toggle = async (id) => { if (openId===id) { setOpenId(null); return; } setOpenId(id); if (!details[id]) { const d = await api.getReport(id); setDetails((m)=>({ ...m, [id]:d })); } };
  return html`<div>
    <button onClick=${onBack} class="mb-3 text-sm text-muted hover:text-sub">← Back</button>
    <h2 class="mb-4 text-lg font-semibold">Past reports — ${siteName}</h2>
    ${reports.loading ? html`<${Loading} what="Loading reports" />` : reports.error ? html`<${ErrorBox} msg=${reports.error} onRetry=${reports.reload} />` : reports.data.length===0 ? html`<div class="rounded-xl border border-dashed border-line bg-surface p-8 text-center text-sm text-muted">No reports for this location yet.</div>`
      : html`<div class="space-y-2">${reports.data.map((rep)=>{ const isOpen=openId===rep.id; const d=details[rep.id]; return html`
        <div key=${rep.id} class="overflow-hidden rounded-xl border border-line bg-surface">
          <button onClick=${()=>toggle(rep.id)} class="flex w-full items-center gap-2 px-4 py-3 text-left">
            <span class="text-muted"><${Icon} n=${isOpen?"chevD":"chevR"} s=16/></span>
            <div class="min-w-0 flex-1"><div class="text-sm font-medium">${fmt(rep.report_date)}</div><div class="text-xs text-muted">${rep.technician}${rep.time_log?" · "+rep.time_log:""}</div></div></button>
          ${isOpen && html`<div class="border-t border-line">${!d ? html`<div class="p-4 text-sm text-muted">Loading…</div>`
            : html`<div class="divide-y divide-line">${d.items.map((it)=>html`<div class="flex items-start gap-2 px-4 py-2 text-sm">
                <span class=${"mt-0.5 shrink-0 rounded px-2 py-0.5 text-[11px] font-semibold " + (it.status==="done"?toneChip.done:it.status==="flag"?toneChip.amber:toneChip.muted)}>${it.status==="done"?"OK":it.status==="flag"?"FLAG":"—"}</span>
                <div class="min-w-0 flex-1"><span class="text-muted">${it.asset_name}:</span> ${it.pm_name}
                  ${it.notes && html`<div class="text-xs text-muted">“${it.notes}”</div>`}
                  ${it.photo_ref && html`<div class="text-[11px] text-muted">photo: ${it.photo_ref.name||"attached"}</div>`}
                </div></div>`)}</div>`}
          </div>`}
        </div>`; })}</div>`}
  </div>`;
}

render(html`<${Root} />`, document.getElementById("app"));
</script>
</body>
</html>
